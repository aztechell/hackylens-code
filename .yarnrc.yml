nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-3.3.0.cjs

# Keep bootstrap/build state inside the generated worktree. This avoids
# machine-global Yarn state and makes sandboxed/offline verification possible.
enableGlobalCache: false
cacheFolder: .yarn/cache
globalFolder: .yarn/global
enableTelemetry: false

# The HackyLens bundle is pure browser code and does not import optional native
# packages (notably canvas). Avoid machine-dependent install scripts.
enableScripts: false
